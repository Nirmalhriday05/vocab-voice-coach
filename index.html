<title>Vocab Voice Coach</title>
<meta name="google" content="notranslate">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap">
<style>
/* Layout concept: a quiet monochrome study card. Serif display word as the hero, hairline rules,
   one ink colour doing all the emphasis; green and red appear only as feedback signals. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#F0F0ED; --fg:#0C0C0C; --muted:#6E6E6A;
  --border:#E3E3DF; --line:#CFCFCA; --inv:#FFFFFF; --good:#2D6A4C; --bad:#A3432D;
  --font-display:'Instrument Serif',Georgia,serif;
  --font-body:'Geist','Public Sans',system-ui,sans-serif;
  --font-hi:'Noto Sans Devanagari','Geist',system-ui,sans-serif;
  --font-kn:'Noto Sans Kannada','Geist',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#121212; --surface-2:#1A1A1A; --fg:#F3F3F0; --muted:#9B9B96;
    --border:#242424; --line:#343434; --inv:#0A0A0A; --good:#7FC6A1; --bad:#E48B74; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#121212; --surface-2:#1A1A1A; --fg:#F3F3F0; --muted:#9B9B96;
  --border:#242424; --line:#343434; --inv:#0A0A0A; --good:#7FC6A1; --bad:#E48B74; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);padding-inline:16px;-webkit-font-smoothing:antialiased}
body.l-hi{font-family:var(--font-hi)} body.l-kn{font-family:var(--font-kn)}
.wrap{max-width:640px;margin:0 auto;padding-block:32px 56px;display:flex;flex-direction:column;gap:20px}
.head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.title{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,7vw,46px);line-height:1;margin:6px 0 0;letter-spacing:-.01em}
.title i{font-style:italic;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;line-height:1.65;max-width:56ch;margin:12px 0 0}
.langbox{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pills{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--surface);gap:2px}
.pill{font:inherit;font-size:13px;font-weight:500;background:transparent;color:var(--muted);border:0;padding:6px 13px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--inv)}
.pill[data-lang="hi"]{font-family:var(--font-hi)} .pill[data-lang="kn"]{font-family:var(--font-kn)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.progress{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.progress .bar{flex:1;min-width:60px;height:2px;background:var(--border);overflow:hidden;border-radius:2px}
.progress .bar > i{display:block;height:100%;background:var(--fg);transition:width .4s ease}
.streak{font-weight:600;color:var(--fg)}
.word-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.word{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,11vw,64px);line-height:1.05;letter-spacing:-.015em}
body.l-hi .word{font-family:var(--font-hi);font-weight:600;font-size:clamp(34px,8vw,48px)}
body.l-kn .word{font-family:var(--font-kn);font-weight:600;font-size:clamp(34px,8vw,48px)}
.pos{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.say{font-size:14px;color:var(--muted);margin-top:6px}
.say b{color:var(--fg);font-weight:600}
.speak-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.speak-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font:inherit;font-weight:500;font-size:13px;cursor:pointer;transition:border-color .2s,background .2s}
.speak-btn:hover{background:var(--surface-2)}
.speak-btn.on{border-color:var(--fg)}
.wave{display:inline-flex;align-items:center;gap:2px;height:14px}
.wave i{width:2px;border-radius:2px;background:var(--fg);height:4px;opacity:.35}
.wave.on i{animation:wv 900ms ease-in-out infinite}
.wave i:nth-child(2){animation-delay:120ms}.wave i:nth-child(3){animation-delay:240ms}
.wave i:nth-child(4){animation-delay:360ms}.wave i:nth-child(5){animation-delay:480ms}
@keyframes wv{0%,100%{height:4px;opacity:.35}50%{height:14px;opacity:1}}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.hint:empty{display:none}
.meaning{border-left:2px solid var(--fg);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.meaning-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meaning-text{font-size:15px;line-height:1.6}
.prompt{font-size:16px;line-height:1.7;margin:0}
.prompt b{font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.answer{position:relative;margin-bottom:6px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.answer:focus-within{border-color:var(--fg)}
.answer.listening{margin-bottom:26px;border-color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb, var(--fg) 8%, transparent)}
.answer textarea{display:block;width:100%;min-height:96px;resize:vertical;border:0;background:transparent;color:var(--fg);font:inherit;font-size:15.5px;line-height:1.6;padding:14px 60px 14px 16px;border-radius:16px}
.answer textarea:focus{outline:none}
.answer-tools{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0;transition:background .2s,color .2s,border-color .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.mic{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.icon-btn.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent)}100%{box-shadow:0 0 0 12px transparent}}
.listen-note{position:absolute;left:16px;bottom:-24px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.listen-note::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.wave.on i,.icon-btn.mic.on,.listen-note::before{animation:none}.wave.on i{opacity:1;height:10px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;border-radius:99px;padding:11px 20px;border:1px solid transparent;cursor:pointer;transition:opacity .2s,background .2s}
.btn-primary{background:var(--fg);color:var(--inv)}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-icon{display:inline-flex;align-items:center;gap:7px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.pill:focus-visible,.speak-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.kbd{font-size:12px;color:var(--muted);margin-left:auto}
.feedback{border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-left:3px solid var(--line)}
.feedback.good{border-left-color:var(--good)} .feedback.bad{border-left-color:var(--bad)}
.fb-head{font-weight:600;font-size:15px}
.feedback.good .fb-head{color:var(--good)} .feedback.bad .fb-head{color:var(--bad)}
.fb-body:empty{display:none}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.checks li{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.checks li::before{flex:none;width:14px;text-align:center;font-weight:600}
.checks li.ok::before{content:"\2713";color:var(--good)}
.checks li.no::before{content:"\2715";color:var(--bad)}
.checks li.tip::before{content:"\2022";color:var(--muted)}
.checks li.tip{color:var(--muted)}
.checks-label,.model span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.model{font-size:14.5px;color:var(--fg);border-top:1px solid var(--border);padding-top:10px}
.model span{margin-bottom:4px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.how div{background:var(--surface);padding:14px;font-size:13px;line-height:1.5;color:var(--muted)}
.how b{display:block;color:var(--fg);font-size:13px;font-weight:600;margin-bottom:3px}
@media (max-width:520px){.how{grid-template-columns:1fr}.langbox{align-items:flex-start}}
.summary h2{font-family:var(--font-display);font-weight:400;font-size:34px;margin:0}
.summary h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:8px 0 0}
body.l-hi .summary h2{font-family:var(--font-hi);font-weight:600;font-size:26px}
body.l-kn .summary h2{font-family:var(--font-kn);font-weight:600;font-size:26px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.stat{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.verdict{font-size:15px;line-height:1.65;margin:0}
.wordlist{display:flex;flex-direction:column;gap:10px}
.wl-row{display:grid;grid-template-columns:132px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px}
.wl-bar{height:3px;border-radius:3px;background:var(--border);overflow:hidden}
.wl-bar > i{display:block;height:100%}
.wl-tag{font-size:11px;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.wl-tag.mastered{color:var(--good)} .wl-tag.practice{color:var(--bad)}
.phrasebook{display:flex;flex-direction:column;gap:10px}
.pb-item{border-left:2px solid var(--fg);padding:2px 0 2px 12px;font-size:14.5px;line-height:1.6}
.pb-item small{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.empty{font-size:14px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
.foot{text-align:center;margin:0;font-size:11px;letter-spacing:.1em;color:var(--muted)}
@media (max-width:420px){.wl-row{grid-template-columns:100px minmax(0,1fr) auto}.card{padding:20px}}
body.l-hi .eyebrow,body.l-kn .eyebrow,body.l-hi .meaning-label,body.l-kn .meaning-label,body.l-hi .checks-label,body.l-kn .checks-label,body.l-hi .model span,body.l-kn .model span,body.l-hi .summary h3,body.l-kn .summary h3,body.l-hi .pos,body.l-kn .pos{letter-spacing:0;text-transform:none;font-size:12.5px}
[hidden]{display:none!important}
</style>

<div class="wrap notranslate" translate="no">
  <header>
    <div class="head-top">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 class="title">Vocab <i>Voice</i> Coach</h1>
      </div>
      <div class="langbox">
        <span class="eyebrow" data-t="langLabel"></span>
        <span class="pills" role="group" aria-label="Language">
          <button class="pill" data-lang="en" aria-pressed="true">English</button>
          <button class="pill" data-lang="hi" aria-pressed="false">हिंदी</button>
          <button class="pill" data-lang="kn" aria-pressed="false">ಕನ್ನಡ</button>
        </span>
      </div>
    </div>
    <p class="sub" data-t="sub"></p>
  </header>

  <section id="startCard" class="card">
    <div class="how">
      <div><b data-t="how1h"></b><span data-t="how1"></span></div>
      <div><b data-t="how2h"></b><span data-t="how2"></span></div>
      <div><b data-t="how3h"></b><span data-t="how3"></span></div>
    </div>
    <div class="chip-row" id="wordChips"></div>
    <div class="row">
      <button class="btn btn-primary" id="beginBtn" data-t="start"></button>
      <span class="note" data-t="startNote"></span>
    </div>
  </section>

  <section id="playCard" class="card" hidden>
    <div class="progress">
      <span id="progLabel"></span>
      <div class="bar"><i id="progBar" style="width:0%"></i></div>
      <span id="streak" class="streak"></span>
    </div>

    <div>
      <div class="word-row">
        <span class="word" id="wordText"></span>
        <span class="pos" id="wordPos"></span>
      </div>
      <div class="say" id="wordSay"></div>
    </div>

    <div class="speak-row">
      <button class="speak-btn" id="speakBtn"><span class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></span><span id="speakLbl"></span></button>
      <button class="speak-btn" id="slowBtn" data-t="slow"></button>
    </div>
    <div class="hint" id="hint"></div>

    <div class="meaning">
      <span class="meaning-label" data-t="meaning"></span>
      <div class="meaning-text" id="meaningText"></div>
    </div>

    <p class="prompt" id="promptText"></p>

    <div class="answer" id="answerWrap">
      <textarea id="answerBox" aria-label="Your sentence"></textarea>
      <span class="listen-note" id="listenNote" hidden></span>
      <div class="answer-tools">
        <button class="icon-btn mic" id="micBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
      </div>
    </div>

    <div class="row">
      <button class="btn btn-primary" id="submitBtn"></button>
      <button class="btn btn-ghost btn-icon" id="clearBtn" type="button"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span data-t="startOver"></span></button>
      <button class="btn btn-ghost" id="skipBtn" data-t="skip"></button>
      <span class="kbd" data-t="enter"></span>
    </div>

    <div class="feedback" id="feedback" hidden></div>
    <div class="row" id="nextRow" hidden>
      <button class="btn btn-primary" id="nextBtn" data-t="next"></button>
    </div>
  </section>

  <section id="summaryCard" class="card summary" hidden>
    <h2 data-t="session"></h2>
    <p class="verdict" id="verdict"></p>
    <div class="stat-row">
      <div class="stat"><b id="statMastered">0</b><span data-t="mastered"></span></div>
      <div class="stat"><b id="statAccuracy">0%</b><span data-t="firstTry"></span></div>
      <div class="stat"><b id="statStreak">0</b><span data-t="best"></span></div>
    </div>
    <h3 data-t="byWord"></h3>
    <div class="wordlist" id="wordlist"></div>
    <h3 data-t="phrasebook"></h3>
    <p class="note" style="margin:0" data-t="pbNote"></p>
    <div class="phrasebook" id="phrasebook"></div>
    <div class="row">
      <button class="btn btn-primary" id="copyBtn" data-t="copy"></button>
      <button class="btn btn-ghost" id="restartBtn" data-t="again"></button>
      <span class="note" id="copyNote"></span>
    </div>
  </section>
</div>

    fb.innerHTML = '<div class="fb-head"></div><div class="fb-body"></div>' + (s.checks ? '<div><span class="checks-label"></span><ul class="checks"></ul></div>' : '') + (s.model ? '<div class="model"><span></span><div></div></div>' : '');
    fb.querySelector('.fb-head').textContent = head;
    fb.querySelector('.fb-body').textContent = body || '';
    if (s.checks){
      fb.querySelector('.checks-label').textContent = t('checked');
      var ul = fb.querySelector('.checks');
      s.checks.forEach(function(c){ if (!c.text) return; var li = document.createElement('li'); li.className = c.kind; li.textContent = c.text; ul.appendChild(li); });
    }
    if (s.model){ fb.querySelector('.model span').textContent = t('modelLabel'); fb.querySelector('.model div').textContent = w.model; }
  }
  function setFeedback(state){ fbState = state; renderFeedback(); }

  function setLang(l){
    if (!T[l] || l === lang) return;
    lang = l;
    stopSpeech(); stopListening();
    $('hint').textContent = '';
    renderStatic();
    if (!$('playCard').hidden && current !== null){ resetWord(); speakSeq(hearParts(current)); }
    if (!$('summaryCard').hidden) showSummary(true);
  }
  document.querySelectorAll('.pill').forEach(function(p){ p.addEventListener('click', function(){ setLang(p.dataset.lang); }); });

  /* ---------- flow ---------- */
  function resetWord(){
    stopListening(); stopSpeech();
    if (current !== null && snap){
      firstTry = snap.firstTry; streak = snap.streak; bestStreak = snap.bestStreak;
      delete result[current]; delete sentences[current]; attempts[current] = 0;
      if (!snap.retried){ delete retried[current]; }
      while (queue.length > snap.qlen) queue.pop();
    }
    answered = false;
    $('answerBox').value = ''; autosize();
    $('hint').textContent = '';
    $('nextRow').hidden = true;
    $('skipBtn').disabled = false;
    $('submitBtn').textContent = t('check');
    setFeedback(null);
    if (current !== null) renderWord();
  }
  function nextWord(){
    setFeedback(null);
    $('nextRow').hidden = true;
    $('answerBox').value = ''; autosize();
    $('skipBtn').disabled = false;
    $('hint').textContent = '';
    answered = false;
    $('submitBtn').textContent = t('check');
    stopListening();
    if (!queue.length){ showSummary(); return; }
    current = queue.shift();
    if (!retried[current]) shown++;
    snap = { firstTry:firstTry, streak:streak, bestStreak:bestStreak, retried:!!retried[current], qlen:queue.length };
    renderWord();
    var intro = firstShown ? pick(t('intros')) : t('greet');
    firstShown = true;
    speakSeq([{ text:intro, lang:lang }].concat(hearParts(current)));
    $('answerBox').focus();
  }

  function norm(s){ return (s || '').normalize('NFC').replace(/़/g,'').toLowerCase(); }
  function usesWord(text, i){
    if (lang === 'en'){
      var tx = ' ' + text.toLowerCase().replace(/[^a-z\s']/g,' ') + ' ';
      var stem = WORDS[i].en.w;
      var forms = [stem, stem+'s', stem+'d', stem+'ed', stem+'ing', stem+'ly', stem+'ity'];
      if (/e$/.test(stem)) forms.push(stem.slice(0,-1)+'ing', stem.slice(0,-1)+'ion');
      if (stem === 'reliable') forms.push('reliably');
      if (stem === 'responsibility') forms.push('responsibilities');
      return forms.some(function(f){ return tx.indexOf(' '+f+' ') !== -1; });
    }
    var n = norm(text);
    return W(i).stems.some(function(st){ return n.indexOf(norm(st)) !== -1; });
  }
  function countWords(text){ return text.trim().split(/\s+/).filter(Boolean).length; }
  function detectScript(text){
    var c = { hi:(text.match(/[\u0900-\u097F]/g)||[]).length, kn:(text.match(/[\u0C80-\u0CFF]/g)||[]).length, en:(text.match(/[A-Za-z]/g)||[]).length };
    var best = 'en'; ['hi','kn'].forEach(function(k){ if (c[k] > c[best]) best = k; });
    return c[best] ? best : lang;
  }
  function analyze(text, i){
    var words = text.trim().split(/\s+/).filter(Boolean);
    var lower = words.map(function(w){ return norm(w).replace(/[.,!?;:"'()\u0964]/g,''); });
    var uniq = {}; lower.forEach(function(w){ uniq[w] = 1; });
    var found = detectScript(text);
    var own = [norm(W(i).w)].concat((W(i).stems || []).map(norm));
    var keys = (KEYS[WORDS[i].en.w][lang] || []).filter(function(k){ var nk = norm(k); return !own.some(function(o){ return o.indexOf(nk) !== -1 || nk.indexOf(o) !== -1; }); });
    var n = ' ' + norm(text).replace(/[.,!?;:"'()\u0964]/g,' ') + ' ';
    var fits = keys.some(function(k){ return n.indexOf(norm(k)) !== -1; });
    var a = {
      langOk: found === lang, found: found,
      hasWord: usesWord(text, i),
      longEnough: words.length >= T[lang].minWords,
      repeated: words.length >= 4 && Object.keys(uniq).length / words.length < 0.5,
      fits: fits, keys: keys,
      capsTip: lang === 'en' && (!/^[A-Z]/.test(text.trim()) || !/[.!?]$/.test(text.trim()))
    };
    a.pass = a.langOk && a.hasWord && a.longEnough && !a.repeated;
    return a;
  }
  function checklist(a, i){
    var w = W(i).w, L = t('L'), list = [];
    list.push(a.langOk ? { kind:'ok', text:t('chkLang', { want:L[lang] }) } : { kind:'no', text:t('chkLangNo', { found:L[a.found], want:L[lang] }) });
    if (a.langOk){
      list.push(a.hasWord ? { kind:'ok', text:t('chkWord', { w:w }) } : { kind:'no', text:t('chkWordNo', { w:w }) });
      if (a.repeated) list.push({ kind:'no', text:t('chkRep') });
      else list.push(a.longEnough ? { kind:'ok', text:t('chkLen') } : { kind:'no', text:t('chkLenNo', { m:T[lang].minWords }) });
      list.push(a.fits ? { kind:'ok', text:t('chkFit') } : { kind:'tip', text:t('chkFitNo', { k: a.keys.slice(0,2).map(function(k){ return '"' + k + '"'; }).join(t('or')) }) });
      if (a.capsTip && t('chkCaps')) list.push({ kind:'tip', text:t('chkCaps') });
    }
    return list;
  }

  function lockAndOfferNext(){
    answered = true;
    $('skipBtn').disabled = true;
    $('submitBtn').textContent = t('checkAgain');
    $('nextRow').hidden = false;
  }

  function submitAnswer(){
    if (listening) stopListening();
    var text = $('answerBox').value.trim();
    if (!text){ setFeedback({ kind:'bad', head:t('emptyH'), body:t('emptyB') }); say(t('emptyB')); return; }
    var a = analyze(text, current), checks = checklist(a, current);
    if (answered){
      setFeedback({ kind: a.pass ? 'good' : 'bad', head:t('recheckH'), body:'', checks:checks, model:true });
      say(a.pass ? t('recheckGood') : t('almostSay'));
      return;
    }
    attempts[current] = (attempts[current]||0) + 1;

    if (a.pass){
      var first = attempts[current] === 1 && !retried[current];
      if (first){ firstTry++; streak++; bestStreak = Math.max(bestStreak, streak); } else { streak = 0; }
      result[current] = 'mastered';
      sentences[current] = { text:text, lang:lang };
      var headIdx = Math.floor(Math.random()*3), s = streak, wasFirst = first;
      setFeedback({ kind:'good', model:true, checks:checks,
        head:(wasFirst ? t('good1') : t('good2'))[headIdx % (wasFirst ? 3 : 2)],
        body: s >= 3 ? t('streakBody', { n:s }) : t('pbBody') });
      var hd = (wasFirst ? t('good1') : t('good2'))[headIdx % (wasFirst ? 3 : 2)];
      var cheer = streak === 5 ? ' ' + t('streak5') : (streak === 3 ? ' ' + t('streak3') : '');
      speakSeq([{ text: hd + cheer + ' ' + t('anotherWay'), lang:lang }, { text: W(current).model, lang:lang }]);
      renderProgress(); lockAndOfferNext();
      return;
    }

    streak = 0;
    if (attempts[current] < 2){
      setFeedback({ kind:'bad', head:t('almost'), body:t('tryAgain'), checks:checks });
      say(a.langOk ? t('almostSay') : t('wrongLangSay'));
      renderProgress();
      return;
    }

    if (!retried[current]){
      retried[current] = true; attempts[current] = 0; queue.push(current);
      setFeedback({ kind:'bad', model:true, checks:checks, head:t('comeBack'), body:W(current).w + ': ' + W(current).def });
      speakSeq([{ text: t('comeBack') + '. ' + t('listenUse'), lang:lang }, { text: W(current).model, lang:lang }, { text: t('moveOn'), lang:lang }]);
    } else {
      result[current] = 'practice';
      setFeedback({ kind:'bad', model:true, checks:checks, head:t('practiceH'), body:t('practiceB') });
      speakSeq([{ text: W(current).model, lang:lang }, { text: t('moveOn'), lang:lang }]);
    }
    renderProgress(); lockAndOfferNext();
  }

  function skipWord(){
    streak = 0;
    if (!retried[current]){ retried[current] = true; attempts[current] = 0; queue.push(current); }
    else { result[current] = 'practice'; }
    nextWord();
  }

  function showSummary(silent){
    stopListening();
    $('playCard').hidden = true; $('summaryCard').hidden = false;
    var mastered = order.filter(function(i){ return result[i]==='mastered'; }).length;
    var acc = Math.round(firstTry/WORDS.length*100);
    $('statMastered').textContent = mastered + '/' + WORDS.length;
    $('statAccuracy').textContent = acc + '%';
    $('statStreak').textContent = bestStreak;
    var weak = order.filter(function(i){ return result[i]!=='mastered'; }).map(function(i){ return W(i).w; });
    $('verdict').textContent = mastered === WORDS.length ? (acc >= 80 ? t('vAllHigh') : t('vAll')) : t('vPart', { m:mastered, t:WORDS.length, list: weak.join(', ') });

    var list = $('wordlist'); list.innerHTML = '';
    order.forEach(function(i){
      var ok = result[i]==='mastered';
      var tag = ok ? (retried[i] ? t('secondRound') : (attempts[i]===1 ? t('tag1') : t('tag2'))) : t('tagPractice');
      var width = ok ? (retried[i] ? 33 : (attempts[i]===1 ? 100 : 66)) : 12;
      var row = document.createElement('div'); row.className='wl-row';
      row.innerHTML = '<b></b><span class="wl-bar"><i></i></span><span class="wl-tag"></span>';
      row.querySelector('b').textContent = W(i).w;
      var bar = row.querySelector('.wl-bar i'); bar.style.width = width + '%'; bar.style.background = 'var(--' + (ok ? 'good' : 'bad') + ')';
      var tg = row.querySelector('.wl-tag'); tg.className = 'wl-tag ' + (ok ? 'mastered' : 'practice'); tg.textContent = tag;
      list.appendChild(row);
    });

    var pb = $('phrasebook'); pb.innerHTML = '';
    var any = false;
    order.forEach(function(i){
      if (!sentences[i]) return; any = true;
      var d = document.createElement('div'); d.className='pb-item';
      d.innerHTML = '<small></small><span></span>';
      d.querySelector('small').textContent = WORDS[i][sentences[i].lang].w;
      d.querySelector('span').textContent = sentences[i].text;
      pb.appendChild(d);
    });
    if (!any){ var e = document.createElement('p'); e.className = 'empty'; e.textContent = t('pbEmpty'); pb.appendChild(e); }
    $('copyBtn').hidden = !any;
    if (!silent) say(mastered === WORDS.length ? t('endAll') : t('endPart', { m:mastered, t:WORDS.length }));
  }

  function phrasebookText(){
    return order.filter(function(i){ return sentences[i]; }).map(function(i){ return WORDS[i][sentences[i].lang].w + ': ' + sentences[i].text; }).join('\n');
  }

  $('copyBtn').addEventListener('click', function(){
    var txt = phrasebookText();
    var done = function(){ $('copyNote').textContent = t('copied'); };
    var fallback = function(){
      var r = document.createRange(); r.selectNodeContents($('phrasebook'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      $('copyNote').textContent = t('selected');
    };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }
  });

  $('beginBtn').addEventListener('click', function(){ reset(); $('startCard').hidden = true; $('playCard').hidden = false; nextWord(); });
  $('submitBtn').addEventListener('click', submitAnswer);
  $('clearBtn').addEventListener('click', function(){
    resetWord();
    $('answerBox').focus();
  });
  $('nextBtn').addEventListener('click', nextWord);
  $('skipBtn').addEventListener('click', function(){ stopSpeech(); stopListening(); skipWord(); });
  $('micBtn').addEventListener('click', listen);
  $('speakBtn').addEventListener('click', function(){
    if (speaking){ stopSpeech(); return; }
    if (current !== null){ $('hint').textContent = ''; speakSeq(hearParts(current)); }
  });
  $('slowBtn').addEventListener('click', function(){ if (current !== null){ $('hint').textContent = ''; speakSeq(slowParts(current)); } });
  $('answerBox').addEventListener('keydown', function(e){ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submitAnswer(); } });
  document.addEventListener('keydown', function(e){ if (e.key==='Enter' && answered && document.activeElement !== $('answerBox') && document.activeElement !== $('nextBtn')){ e.preventDefault(); nextWord(); } });
  $('restartBtn').addEventListener('click', function(){ stopSpeech(); $('summaryCard').hidden = true; $('startCard').hidden = false; $('copyNote').textContent = ''; });

  reset();
  renderStatic();
  setSpeaking(false);
})();
</script>
